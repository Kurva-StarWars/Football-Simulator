<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate AI Football - Stable UI Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@400;700;900&display=swap');
        
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        .setup-screen { z-index: 100; background: linear-gradient(to bottom, #0f172a, #020617); overflow-y: auto; position: fixed; inset: 0; }
        .player-card { background: #1e293b; padding: 10px; border-radius: 10px; border: 2px solid #334155; }
        .pos-label { font-family: 'Black Ops One', cursive; color: #fbbf24; font-size: 0.75rem; letter-spacing: 1px; }
        
        #game-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 10px; box-sizing: border-box; }
        
        canvas { background: #064e3b; border: 4px solid #065f46; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); max-width: 100%; max-height: 100%; object-fit: contain; }

        /* ИСПРАВЛЕННОЕ ТАБЛО */
        .score-board { 
            background: rgba(15, 23, 42, 0.95); 
            padding: 8px 20px; 
            border-radius: 16px; 
            border: 2px solid #334155;
            display: flex; 
            gap: 15px; 
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            min-width: 320px;
            justify-content: center;
        }

        .score-display {
            font-family: 'Inter', sans-serif;
            font-variant-numeric: tabular-nums; /* Цифры одинаковой ширины */
            background: #ffffff;
            color: #000000;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 110px; /* Жесткая ширина чтобы не скакало */
            text-align: center;
            font-style: italic;
        }

        .team-label {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 900;
            text-transform: uppercase;
        }

        .hidden { display: none; }
    </style>
</head>
<body class="items-center">

    <!-- МЕНЮ НАСТРОЕК -->
    <div id="setup" class="setup-screen p-4">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-4xl md:text-6xl font-black mb-8 text-center italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">
                PRO FOOTBALL SIM ⚽️
            </h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Команда 1 -->
                <div class="bg-slate-800/40 p-6 rounded-3xl border-l-8 border-blue-500" id="t1">
                    <div class="flex items-center gap-4 mb-6">
                        <input type="color" value="#2563eb" class="t-color w-10 h-10 rounded-full cursor-pointer bg-transparent border-none">
                        <input type="text" value="GRIFFINS" class="t-name bg-transparent text-2xl font-black uppercase border-b-2 border-slate-700 outline-none w-full text-white">
                    </div>
                    <div class="flex gap-2 mb-6 items-center text-sm">
                        <span class="text-slate-400 uppercase font-black">Схема:</span>
                        <input type="number" value="4" min="1" max="5" class="t-def w-12 bg-slate-900 p-1 rounded text-center border border-slate-700 text-white">
                        <input type="number" value="4" min="1" max="5" class="t-mid w-12 bg-slate-900 p-1 rounded text-center border border-slate-700 text-white">
                        <input type="number" value="2" min="1" max="5" class="t-fwd w-12 bg-slate-900 p-1 rounded text-center border border-slate-700 text-white">
                        <button onclick="refreshUI('t1')" class="bg-blue-600 hover:bg-blue-500 px-4 py-1 rounded-lg transition-all text-xs font-black">SET</button>
                    </div>
                    <div class="t-list grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[300px] overflow-y-auto p-1"></div>
                </div>

                <!-- Команда 2 -->
                <div class="bg-slate-800/40 p-6 rounded-3xl border-r-8 border-red-500" id="t2">
                    <div class="flex items-center gap-4 mb-6">
                        <input type="color" value="#dc2626" class="t-color w-10 h-10 rounded-full cursor-pointer bg-transparent border-none">
                        <input type="text" value="DRAGONS" class="t-name bg-transparent text-2xl font-black uppercase border-b-2 border-slate-700 outline-none w-full text-right text-white">
                    </div>
                    <div class="flex gap-2 mb-6 items-center justify-end text-sm">
                        <span class="text-slate-400 uppercase font-black">Схема:</span>
                        <input type="number" value="4" min="1" max="5" class="t-def w-12 bg-slate-900 p-1 rounded text-center border border-slate-700 text-white">
                        <input type="number" value="3" min="1" max="5" class="t-mid w-12 bg-slate-900 p-1 rounded text-center border border-slate-700 text-white">
                        <input type="number" value="3" min="1" max="5" class="t-fwd w-12 bg-slate-900 p-1 rounded text-center border border-slate-700 text-white">
                        <button onclick="refreshUI('t2')" class="bg-red-600 hover:bg-red-500 px-4 py-1 rounded-lg transition-all text-xs font-black">SET</button>
                    </div>
                    <div class="t-list grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[300px] overflow-y-auto p-1"></div>
                </div>
            </div>

            <div class="mt-8 flex justify-center">
                <button id="start" class="bg-yellow-400 hover:bg-yellow-300 text-black px-16 py-4 rounded-xl font-black text-2xl uppercase tracking-widest shadow-xl transition-all hover:scale-105 active:scale-95">
                    ИГРАТЬ ⚽️
                </button>
            </div>
        </div>
    </div>

    <!-- ИГРОВАЯ ЗОНА -->
    <div id="game-container" class="hidden">
        <div class="score-board">
            <div id="uiL" class="team-label text-blue-500 text-right">GRIFFINS</div>
            <div class="score-display">
                <span id="score1">0</span>
                <span>-</span>
                <span id="score2">0</span>
            </div>
            <div id="uiR" class="team-label text-red-500">DRAGONS</div>
            <div class="border-l-2 border-slate-700 pl-4">
                <div id="uiTime" class="text-xl font-black text-yellow-400 tabular-nums">02:00</div>
            </div>
        </div>
        <canvas id="pitch"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('pitch');
        const ctx = canvas.getContext('2d');
        let audio;

        const FIELD_W = 1200;
        const FIELD_H = 800;

        const POS_LABELS = { GK: 'GK', DEF: ['LB', 'CB', 'CB', 'CB', 'RB'], MID: ['LM', 'CM', 'CM', 'CM', 'RM'], FWD: ['LW', 'ST', 'ST', 'ST', 'RW'] };
        const NAMES = ["Mbappe", "Messi", "Ronaldo", "Kane", "Salah", "De Bruyne", "Modric", "Van Dijk", "Alisson", "Walker", "Saka", "Foden", "Haaland", "Rodri", "Bellingham", "Lewy"];

        function refreshUI(tid) {
            const list = document.querySelector(`#${tid} .t-list`);
            const d = parseInt(document.querySelector(`#${tid} .t-def`).value) || 4;
            const m = parseInt(document.querySelector(`#${tid} .t-mid`).value) || 4;
            const f = parseInt(document.querySelector(`#${tid} .t-fwd`).value) || 2;
            list.innerHTML = '';
            const roles = [['GK', 1], ['DEF', d], ['MID', m], ['FWD', f]];
            roles.forEach(([role, count]) => {
                for (let i = 0; i < count; i++) {
                    const label = role === 'GK' ? 'GK' : POS_LABELS[role][Math.min(i, 4)];
                    const card = document.createElement('div');
                    card.className = 'player-card flex flex-col gap-1';
                    card.innerHTML = `
                        <div class="pos-label">${label}</div>
                        <div class="flex gap-1">
                            <input type="number" value="${role === 'GK' ? 1 : Math.floor(Math.random()*90)+2}" class="p-num w-10 bg-slate-950 p-1 rounded font-black text-center text-xs border border-slate-700 text-white">
                            <input type="text" value="${NAMES[Math.floor(Math.random()*NAMES.length)]}" class="p-name bg-transparent border-b border-slate-600 focus:border-yellow-500 outline-none flex-1 font-bold text-xs text-white">
                            <input type="hidden" class="p-role" value="${role}">
                            <input type="hidden" class="p-label" value="${label}">
                        </div>`;
                    list.appendChild(card);
                }
            });
        }
        refreshUI('t1'); refreshUI('t2');

        const state = { active: false, time: 120, score: [0, 0], players: [], ball: { x: 600, y: 400, vx: 0, vy: 0, owner: null } };

        function sfx(f, t, d) {
            if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
            const o = audio.createOscillator(); const g = audio.createGain();
            o.type = t; o.frequency.value = f; g.gain.setValueAtTime(0.05, audio.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d);
            o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
        }

        class Player {
            constructor(team, role, label, name, num, color, side) {
                this.team = team; this.role = role; this.label = label;
                this.name = name; this.num = num; this.color = color; this.side = side;
                this.x = 0; this.y = 0; this.hx = 0; this.hy = 0;
                this.vx = 0; this.vy = 0;
                this.speed = 2.5 + Math.random() * 0.7;
                this.radius = 18; this.cooldown = 0;
            }

            update() {
                if (this.cooldown > 0) this.cooldown--;
                let tx = this.hx, ty = this.hy;
                const dBall = Math.hypot(state.ball.x - this.x, state.ball.y - this.y);
                const isOurBall = state.ball.owner && state.ball.owner.team === this.team;

                if (state.ball.owner === this) {
                    const goalX = this.side === 1 ? FIELD_W : 0;
                    const distToGoal = Math.abs(goalX - this.x);
                    
                    if (distToGoal < 320) {
                        this.shoot();
                    } else {
                        if (Math.random() < 0.03) {
                            this.smartPass();
                        } else {
                            tx = goalX; ty = 400 + (this.y - 400) * 0.4;
                        }
                    }
                } else {
                    if (this.role === 'GK') {
                        const baseGoalX = this.side === 1 ? 50 : 1150;
                        ty = Math.max(330, Math.min(470, state.ball.y));
                        if (dBall < 200) {
                            tx = state.ball.x;
                            tx = this.side === 1 ? Math.min(160, tx) : Math.max(1040, tx);
                        } else {
                            tx = baseGoalX;
                        }
                    } else if (!isOurBall && dBall < 480) {
                        const closest = state.players
                            .filter(p => p.team === this.team && p.role !== 'GK')
                            .sort((a,b) => Math.hypot(a.x-state.ball.x, a.y-state.ball.y) - Math.hypot(b.x-state.ball.x, b.y-state.ball.y))[0];
                        if (closest === this) { tx = state.ball.x; ty = state.ball.y; }
                    }
                }

                const angle = Math.atan2(ty - this.y, tx - this.x);
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;

                state.players.forEach(p => {
                    if (p === this) return;
                    const d = Math.hypot(p.x - this.x, p.y - this.y);
                    let minDist = 45;
                    if (p.role === 'GK' && state.ball.owner === p) minDist = 80;
                    if (d < minDist) {
                        const force = (minDist - d) / minDist * 5;
                        this.vx += (this.x - p.x) / d * force;
                        this.vy += (this.y - p.y) / d * force;
                    }
                });

                this.x += this.vx; this.y += this.vy;
                if (dBall < 22 && !state.ball.owner && this.cooldown === 0) {
                    state.ball.owner = this;
                    if (this.role === 'GK') this.cooldown = 50; 
                    sfx(200, 'sine', 0.05);
                }
            }

            smartPass() {
                if (state.ball.owner !== this) return;
                const mates = state.players.filter(p => p.team === this.team && p !== this);
                let options = mates.filter(m => (this.side === 1 ? m.x > this.x - 30 : m.x < this.x + 30));
                if (options.length === 0) options = mates.filter(m => m.role !== 'GK');
                if (options.length === 0) options = mates;
                const target = options[Math.floor(Math.random() * options.length)];
                state.ball.owner = null; this.cooldown = 45;
                const a = Math.atan2(target.y - this.y, target.x - this.x);
                state.ball.vx = Math.cos(a) * 12; state.ball.vy = Math.sin(a) * 12;
                sfx(300, 'sine', 0.08);
            }

            shoot() {
                if (state.ball.owner !== this) return;
                state.ball.owner = null; this.cooldown = 70;
                const tx = this.side === 1 ? FIELD_W : 0;
                const ty = 360 + Math.random() * 80;
                const a = Math.atan2(ty - this.y, tx - this.x);
                const p = 19 + Math.random() * 4;
                state.ball.vx = Math.cos(a) * p; state.ball.vy = Math.sin(a) * p;
                sfx(150, 'sine', 0.2);
            }

            draw() {
                ctx.save();
                ctx.beginPath(); ctx.ellipse(this.x, this.y + 15, 12, 6, 0, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = '900 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(this.num, this.x, this.y + 5);
                ctx.font = '900 11px Inter'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
                ctx.strokeText(this.name.toUpperCase(), this.x, this.y - 30);
                ctx.fillText(this.name.toUpperCase(), this.x, this.y - 30);
                ctx.fillStyle = '#fbbf24'; ctx.font = '900 10px Black Ops One';
                ctx.fillText(this.label, this.x, this.y + 38);
                if (this.role === 'GK') {
                    ctx.font = '16px serif'; ctx.fillText('🧤', this.x - 20, this.y); ctx.fillText('🧤', this.x + 20, this.y);
                }
                ctx.restore();
            }
        }

        function init() {
            state.players = [];
            ['t1', 't2'].forEach((id, idx) => {
                const color = document.querySelector(`#${id} .t-color`).value;
                const name = document.querySelector(`#${id} .t-name`).value;
                const side = idx === 0 ? 1 : -1;
                document.getElementById(idx === 0 ? 'uiL' : 'uiR').innerText = name;
                const rls = { GK:1, DEF:parseInt(document.querySelector(`#${id} .t-def`).value), MID:parseInt(document.querySelector(`#${id} .t-mid`).value), FWD:parseInt(document.querySelector(`#${id} .t-fwd`).value) };
                const cur = { GK:0, DEF:0, MID:0, FWD:0 };
                document.querySelectorAll(`#${id} .player-card`).forEach(c => {
                    const role = c.querySelector('.p-role').value;
                    const p = new Player(idx, role, c.querySelector('.p-label').value, c.querySelector('.p-name').value, c.querySelector('.p-num').value, color, side);
                    const i = cur[role]++; const spc = 700 / (rls[role] + 1);
                    p.hy = 50 + spc * (i + 1);
                    if (role === 'GK') p.hx = side === 1 ? 60 : 1140;
                    else if (role === 'DEF') p.hx = side === 1 ? 280 : 920;
                    else if (role === 'MID') p.hx = side === 1 ? 580 : 620;
                    else p.hx = side === 1 ? 950 : 250;
                    p.x = p.hx; p.y = p.hy;
                    state.players.push(p);
                });
            });
            state.active = true; canvas.width = FIELD_W; canvas.height = FIELD_H;
            sfx(600, 'square', 0.4);
        }

        function loop() {
            if (state.active) {
                state.players.forEach(p => p.update());
                if (state.ball.owner) {
                    state.ball.x = state.ball.owner.x + (state.ball.owner.side * 18);
                    state.ball.y = state.ball.owner.y;
                    state.ball.vx = 0; state.ball.vy = 0;
                } else {
                    state.ball.x += state.ball.vx; state.ball.y += state.ball.vy;
                    state.ball.vx *= 0.985; state.ball.vy *= 0.985;
                    if (state.ball.y < 25 || state.ball.y > 775) state.ball.vy *= -0.8;
                    if (state.ball.y > 330 && state.ball.y < 470) {
                        if (state.ball.x < 15) { state.score[1]++; resetBall(); }
                        else if (state.ball.x > 1185) { state.score[0]++; resetBall(); }
                    } else if (state.ball.x < 15 || state.ball.x > 1185) state.ball.vx *= -0.8;
                }
                state.time -= 1/60;
                
                // ОБНОВЛЕНИЕ ТАБЛО БЕЗ СКАЧКОВ
                document.getElementById('score1').innerText = state.score[0];
                document.getElementById('score2').innerText = state.score[1];
                
                const m = Math.floor(state.time / 60), s = Math.floor(state.time % 60);
                document.getElementById('uiTime').innerText = `${m}:${s.toString().padStart(2, '0')}`;
                if (state.time <= 0) state.active = false;
            }
            ctx.fillStyle = '#065f46'; ctx.fillRect(0,0,FIELD_W,FIELD_H);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 5;
            ctx.strokeRect(10,10,FIELD_W-20,FIELD_H-20);
            ctx.beginPath(); ctx.moveTo(600,10); ctx.lineTo(600,790); ctx.stroke();
            ctx.beginPath(); ctx.arc(600, 400, 80, 0, Math.PI*2); ctx.stroke();
            ctx.strokeRect(10, 200, 160, 400); ctx.strokeRect(1030, 200, 160, 400);
            state.players.sort((a,b) => a.y - b.y).forEach(p => p.draw());
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(state.ball.x, state.ball.y, 10, 0, Math.PI*2);
            ctx.shadowBlur = 10; ctx.shadowColor = '#000'; ctx.fill(); ctx.shadowBlur = 0;
            requestAnimationFrame(loop);
        }

        function resetBall() {
            state.ball = { x: 600, y: 400, vx: 0, vy: 0, owner: null };
            state.players.forEach(p => { p.x = p.hx; p.y = p.hy; p.cooldown = 60; });
            sfx(500, 'triangle', 0.4);
        }

        document.getElementById('start').addEventListener('click', () => {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            init(); loop();
        });
    </script>
</body>
</html>
